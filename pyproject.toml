[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paperfetch"
version = "0.1.0"
description = "Find and download PDFs of scholarly articles via open access or your institution's subscriptions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
paperfetch = "paperfetch.cli:main"

[tool.setuptools]
packages = ["paperfetch"]
